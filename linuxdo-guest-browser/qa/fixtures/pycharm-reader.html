<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>论坛隐私阅读排版夹具</title>
<style>
/* Representative host markup with conflicting fonts and fixed desktop widths;
   this is a synthetic fixture, not a snapshot of any complete live page. */
body{margin:8px;font:16px/1.3 Georgia,serif;background:#fff;color:#222}*{box-sizing:border-box}a{color:#369;text-decoration:none}.avatar{width:48px;height:48px}
#main-outlet-wrapper{display:grid;grid-template-columns:240px 1fr;padding:25px}#main-outlet{min-width:500px}.topic-list{width:100%;border-collapse:collapse}.topic-list td{padding:18px}.topic-area{width:760px}.topic-post .row{display:flex}.topic-avatar{width:60px}.topic-body{width:690px}.names{display:flex;font:700 15px Georgia}.cooked{font:16px/1.4 Georgia}.cooked h2{font-size:30px}
#Wrapper>.content{width:1060px;margin:auto}#Main{margin:0 290px 0 20px}.box{margin-bottom:20px}.cell,.header{padding:20px}#Tabs a{display:inline-block;padding:8px}.item_title{font:20px/1.2 Arial}.topic_info{font:12px Georgia}.topic_content{font:16px/1.5 Arial}.markdown_body{font-size:18px}.reply_content{font:16px/1.3 Georgia}.sep5{height:5px}
#nsk-body{display:flex;max-width:1200px;margin:auto}#nsk-body-left{width:800px}.post-list{padding:24px;list-style:none}.post-list-item{min-height:80px}.post-list-content{margin-left:60px;width:650px}.post-title{font:18px/1.3 Georgia}.post-list-item .post-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.post-info{font-size:10px;white-space:nowrap}.comments{padding-left:40px}.content-item{list-style:none}.post-content{font:15px/1.4 Arial}.post-content h2{font-size:28px}.nsk-content-meta-info{display:flex}.author-info{font-weight:bold}.post-content blockquote{margin:25px 40px}
h1{font-size:30px}h2{font-size:28px}p{margin:1em 0}blockquote{margin:20px 40px;border-left:5px solid #369;padding:16px}pre{max-width:none;white-space:pre;padding:20px;background:#eee}code{font:15px Monaco,monospace}.topic_content table,.cooked table,.post-content table{width:900px}td,th{padding:12px}img{max-width:none}
</style></head><body><script type="module">
const params=new URLSearchParams(location.search), site=params.get('site')||'linuxdo', view=params.get('view')||'topic';
const engine=({linuxdo:'discourse',idcflare:'discourse',nodeseek:'nodeseek',v2ex:'v2ex'})[site];
if(!engine)throw new Error('Unknown fixture site');
const colors=params.get('scheme')==='dark'?['#2b2d30','#232529','#393b40','#4e5157','#dfe1e5','#a9adb5','#b8bcc4','dark']:['#f7f8fa','#ffffff','#f0f1f3','#d9dce1','#25272b','#646a73','#555b65','light'];
const keys=['BG','PANEL','SOFT','BORDER','TEXT','MUTED','ACCENT','SCHEME'];
const fill=css=>keys.reduce((s,key,i)=>s.replaceAll('__LEX_IDE_'+key+'__',colors[i]),css);
const resources='../../pycharm/src/main/resources/';
const paths=params.has('baseline')?['../artifacts/reader-layout-before/reader-mode.css',`../artifacts/reader-layout-before/${engine}.css`]:[resources+'reader-mode.css',resources+`sites/${engine}.css`];
const title='把多个论坛放进 IDE 之后，怎样让长标题和中文正文都读起来更舒服？';
const avatar='<img class="avatar avatar-normal" alt="测试头像" src="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2248%22 height=%2248%22%3E%3Crect width=%2248%22 height=%2248%22 fill=%22orange%22/%3E%3C/svg%3E">';
const meta='<a href="#author">reader_01</a> · 10 月 9 日 · 阅读体验';
const picture='<img data-test="image" alt="保留原色的正文示意图" width="640" height="90" src="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22640%22 height=%2290%22%3E%3Crect width=%22640%22 height=%2290%22 fill=%22%236682c4%22/%3E%3Crect width=%22210%22 height=%2290%22 fill=%22%23cb9768%22/%3E%3C/svg%3E">';
const prose=`<div class="markdown_body"><p data-test="paragraph"><span style="font-family:Georgia;font-size:22px">这是一段中英文混排的正文。Privacy reader 应当保留清楚的层级，让不同论坛拥有一致的阅读节奏。</span></p><h2 data-test="heading">统一排版，不丢失内容</h2><p>正文使用相同字体，<strong>重点仍然加粗</strong>，<em>强调仍然保留</em>，代码使用 <code>readerMode.sync()</code>。</p><blockquote data-test="quote"><p>引用有适当缩进，与正文区分；窄窗口也能完整阅读。</p></blockquote><ul><li>标题、正文、作者与时间各有层级。</li><li>长链接换行：<a href="#long">https://example.test/${'long-path-'.repeat(14)}</a></li></ul><pre data-test="code"><code>const message = "${'Long code stays inside its own scroll area. '.repeat(4)}";
console.log(message);</code></pre>${picture}<table data-test="table"><tr><th>项目</th><th>很长的列名</th><th>说明</th></tr><tr><td>主题</td><td>${'column_'.repeat(22)}</td><td>表格可独立横向滚动</td></tr></table></div>`;
const titles=[title,'一份适合日常阅读的布局：字号、间距与信息层级','Node.js / Python / Java：代码块与长链接应该怎样显示？'];
const selectors={discourse:{root:'#main-outlet',content:'.topic-list,.category-list,#topic-title,.topic-post',identity:'.avatar,.topic-avatar',username:'.topic-post .names a'},nodeseek:{root:'#nsk-body',content:'.post-list-item,.nsk-post',identity:'.avatar-normal,.avatar-wrapper',username:'.author-name,.info-author a'},v2ex:{root:'#Main',content:'#Main .box',identity:'.avatar,.badges,.badge,#Main .header > .fr',username:'#Main strong > a.dark'}};
let content;
if(engine==='discourse'){
 content=view==='list'?`<table class="topic-list"><thead><tr><th>主题</th></tr></thead><tbody>${titles.map(t=>`<tr><td class="main-link"><div class="link-top-line"><a class="title" data-test="list-title" href="#topic">${t}</a></div><div class="link-bottom-line" data-test="meta">${meta}</div></td><td class="posters">${avatar}</td><td class="num">28</td></tr>`).join('')}</tbody></table>`:`<div id="topic-title"><h1 data-test="title">${title}</h1></div><div class="topic-area"><div class="posts-wrapper"><div class="topic-post"><article><div class="row"><div class="topic-avatar">${avatar}</div><div class="topic-body"><div class="names" data-test="meta">${meta}</div><div class="cooked">${prose}</div></div></div></article></div></div></div>`;
 document.body.innerHTML=`<div id="main-outlet-wrapper"><main id="main-outlet">${content}</main></div>`;
}else if(engine==='v2ex'){
 content=view==='list'?`<div class="box"><div id="Tabs" class="cell"><a href="#all">全部</a><a href="#hot">最热</a><a href="#tech">技术</a><a href="#life">生活</a></div>${titles.map(t=>`<div class="cell item"><table><tbody><tr><td width="48">${avatar}</td><td width="10"></td><td width="auto"><span class="item_title"><a data-test="list-title" href="#topic">${t}</a></span><div class="sep5"></div><span class="topic_info" data-test="meta">${meta}</span></td><td width="70"><a class="count_livid">28</a></td></tr></tbody></table></div>`).join('')}</div>`:`<div class="box"><div class="header"><div class="fr">${avatar}</div><h1 data-test="title">${title}</h1><small class="gray" data-test="meta">${meta}</small></div><div class="cell"><div class="topic_content">${prose}</div></div></div><div class="box"><div class="cell"><table><tr><td width="48">${avatar}</td><td width="10"></td><td width="auto"><strong><a class="dark">reader_02</a></strong><div class="reply_content"><p>这是一条回复，和主楼使用相同的字体与行距。</p></div></td></tr></table></div></div>`;
 document.body.innerHTML=`<div id="Top">站点导航</div><div id="Wrapper"><div class="content"><main id="Main">${content}</main><aside id="Rightbar">侧栏</aside></div></div>`;
}else{
 content=view==='list'?`<ul class="post-list">${titles.map(t=>`<li class="post-list-item">${avatar}<div class="post-list-content"><div class="post-title"><a data-test="list-title" href="#topic">${t}</a></div><div class="post-info" data-test="meta">${meta}</div></div></li>`).join('')}</ul>`:`<div class="nsk-post"><div class="post-title"><h1 data-test="title">${title}</h1></div><ul class="comments"><li class="content-item"><div class="nsk-content-meta-info" data-test="meta"><div class="avatar-wrapper">${avatar}</div><div class="author-info">${meta}</div></div><div class="post-content">${prose}</div></li></ul></div>`;
 document.body.innerHTML=`<header><div id="nsk-head"><ul class="nav-menu"><li><a>最新</a></li><li><a>技术</a></li><li><a>日常</a></li></ul></div></header><div id="nsk-frame"><main id="nsk-body"><div id="nsk-body-left">${content}</div></main></div>`;
}
for(const path of paths){const response=await fetch(path);if(!response.ok)throw new Error(path);const style=document.createElement('style');style.textContent=fill(await response.text());document.head.append(style);}
const source=await(await fetch(resources+'reader-mode.js')).text();const script=document.createElement('script');script.textContent=source.replace('__LEXIAO_DEMO_MODE__','true').replace('__LEXIAO_READER_SITE__',JSON.stringify(selectors[engine]));document.body.append(script);document.documentElement.dataset.fixtureReady='true';
</script></body></html>
